plugins { id 'com.android.application' }
android {
 namespace 'fr.onbreax.matchwork'
 compileSdk 35
 defaultConfig { applicationId 'fr.onbreax.matchwork'; minSdk 26; targetSdk 35; versionCode 9; versionName '1.1.7' }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


tasks.register("prepareSharedHtml", Exec) { workingDir rootProject.projectDir; commandLine "python3", "prepare.py" }
tasks.named("preBuild").configure { dependsOn "prepareSharedHtml" }
