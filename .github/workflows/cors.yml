name: tmp cors check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          u="https://online.turfinfo.api.pmu.fr/rest/client/61/programme/$(TZ=Europe/Paris date +%d%m%Y)"
          echo "== sans Origin"; curl -sS -D - -o /dev/null "$u" | grep -i -E "^HTTP|access-control|content-type"
          echo "== Origin pmu.fr"; curl -sS -D - -o /dev/null -H "Origin: https://www.pmu.fr" "$u" | grep -i -E "^HTTP|access-control"
          echo "== Origin github.io"; curl -sS -D - -o /dev/null -H "Origin: https://onbreax.github.io" "$u" | grep -i -E "^HTTP|access-control"
