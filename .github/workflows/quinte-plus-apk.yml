name: Quinté+ - construire l'APK

on:
  push:
    branches: [main]
    paths: ["quinte-plus-android/**", ".github/workflows/quinte-plus-apk.yml"]
  pull_request:
    paths: ["quinte-plus-android/**", ".github/workflows/quinte-plus-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: quinte-plus-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quinte-plus-apk
          path: quinte-plus-android/app/build/outputs/apk/debug/app-debug.apk
      # Sur main : publie l'APK pour le lien « Quinté+ du jour » de la page d'accueil.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk quinte-plus.apk
          gh release create "quinte-plus-${{ github.run_number }}" quinte-plus.apk \
            --title "Quinté+ du jour (build ${{ github.run_number }})" \
            --notes "APK de l'app Android Quinté+ du jour." --latest
