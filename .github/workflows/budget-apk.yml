name: Mon budget - construire l'APK

on:
  push:
    branches: [main]
    paths: ["budget-android/**", ".github/workflows/budget-apk.yml"]
  pull_request:
    paths: ["budget-android/**", ".github/workflows/budget-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: budget-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mon-budget-apk
          path: budget-android/app/build/outputs/apk/debug/app-debug.apk
      # Sur main : publie l'APK pour le téléchargement direct.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mon-budget.apk
          gh release create "mon-budget-${{ github.run_number }}" mon-budget.apk \
            --title "Mon budget (build ${{ github.run_number }})" \
            --notes "APK de l'app Android Mon budget." --latest=false
