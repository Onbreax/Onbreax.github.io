<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Retour vers Mes dépenses</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#edf1f6;color:#172536;margin:0;padding:30px 20px}main{max-width:480px;margin:60px auto;background:#fff;padding:28px;border:1px solid #ccd5e0;border-radius:16px}h1{font-size:25px}a,button{display:block;box-sizing:border-box;width:100%;margin:12px 0;border-radius:9px;border:1px solid #aab8ca;padding:12px;font:inherit;text-align:center;text-decoration:none;background:#fff;color:#172536;cursor:pointer}a{background:#b62e55;color:#fff;border-color:#b62e55}p{color:#5d6a7c;font-size:14px}small{color:#5d6a7c}</style></head><body><main><h1>Reviens dans Mes dépenses.</h1><p id="message">Le retour doit être validé dans l’espace depuis lequel tu as lancé la connexion. Cette page n’affiche aucune opération bancaire.</p><a id="android" hidden>Ouvrir l’application Android</a><button id="copy" hidden>Copier le lien de retour</button><p id="status" role="status"></p><small>Sur ordinateur : reviens à Mes dépenses, ouvre Réglages puis « Terminer avec le lien de retour ».</small></main><script>
"use strict";
const params=new URLSearchParams(location.search),code=params.get("code"),state=params.get("state"),url=location.href;
if(code&&state&&code.length<=12000&&state.length<=200&&!params.get("error")){
 const q=new URLSearchParams({code,state});
 const a=document.getElementById("android");a.href="mesdepenses://retour?"+q;a.hidden=false;
 const button=document.getElementById("copy");button.hidden=false;
 button.onclick=async()=>{try{await navigator.clipboard.writeText(url);document.getElementById("status").textContent="Lien copié. Colle-le dans ton espace Mes dépenses.";}catch{document.getElementById("status").textContent="Copie l’adresse depuis la barre du navigateur.";}};
}else document.getElementById("message").textContent="L’autorisation est incomplète ou a été interrompue. Reviens dans Mes dépenses et recommence la connexion.";
</script></body></html>
